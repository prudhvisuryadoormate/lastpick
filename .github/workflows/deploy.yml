name: Deploy to Firebase

# Every push to main builds the web app and deploys ONLY LastPick's parts: its hosting site,
# its Firestore database ("lastpick") and its functions codebase ("lastpick"). Other apps in the project are untouched.
# Runs only after these are added in GitHub -> Settings -> Secrets and variables -> Actions:
#   Secret   FIREBASE_SERVICE_ACCOUNT   (full JSON of a Firebase service-account key)
#   Variable FIREBASE_PROJECT_ID        (laundry-staging-c0722)
# The web config itself is read from .env.production.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ vars.FIREBASE_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build web app
        run: |
          npm install
          npm run build

      - name: Install functions dependencies
        run: npm install --prefix functions

      - name: Deploy
        run: |
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13 deploy --only hosting,firestore,functions:lastpick --project "${{ vars.FIREBASE_PROJECT_ID }}" --non-interactive
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
